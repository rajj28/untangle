<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#cbb89a;display:flex;align-items:center;justify-content:center;height:100vh}
.paper{width:620px;padding:34px 40px;background:#fbf6e9;box-shadow:0 18px 40px rgba(0,0,0,.35);transform:rotate(-2.2deg);position:relative;
 background-image:repeating-linear-gradient(#fbf6e9 0 33px,#d9e3f0 33px 34px)}
.head{font-family:'Special Elite',monospace;font-size:26px;letter-spacing:2px;color:#2b2b2b;border-bottom:2px solid #444;padding-bottom:6px}
.sub{font-family:'Special Elite',monospace;font-size:14px;color:#555;margin:6px 0 14px}
.hand{font-family:'Caveat',cursive;font-size:30px;color:#1d3b8f;line-height:34px}
.row{display:flex;justify-content:space-between}
.strike{text-decoration:line-through;text-decoration-thickness:3px;color:#1d3b8f;opacity:.85}
.stamp{position:absolute;right:46px;bottom:70px;transform:rotate(-14deg);border:3px solid #b3261e;color:#b3261e;font-family:'Special Elite';padding:4px 10px;font-size:18px;opacity:.75}
.coffee{position:absolute;left:-30px;top:200px;width:120px;height:120px;border-radius:50%;border:9px solid rgba(120,80,40,.18)}
</style></head><body><div class="paper"><div class="coffee"></div>
<div class="head">ROSSI MILL · DELIVERY DOCKET</div><div class="sub">No. 4518 &nbsp;&nbsp; 14 Mill Rd &nbsp;&nbsp; Date: 27/10</div>
<div class="hand">To: Corner Cafe</div>
<div class="hand row"><span>12 x 25kg pastry flour</span><span><span class="strike">$450.00</span></span></div>
<div class="hand row"><span>(price went up - see note)</span><span>$480.00</span></div>
<div class="hand row"><span>TOTAL</span><span><b>$480.00</b></span></div>
<div class="hand">Pay by: 15 Dec &nbsp; thx! - Marco</div>
<div class="hand">Rec'd by: ____________</div><div class="stamp">DELIVERED</div></div></body></html>
